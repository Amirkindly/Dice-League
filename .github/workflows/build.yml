name: Build Dice League APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        run: |
          echo "Files in repo:"
          find . -type f -not -path "./.git/*" | head -50
          ZIP=$(find . -iname "*.zip" -not -path "./.git/*" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            mkdir -p src
            unzip -q "$ZIP" -d src
          fi
          SETTINGS=$(find . -name "settings.gradle.kts" -not -path "./.git/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: project files not found in the repo"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV
          echo "Project dir: $(dirname "$SETTINGS")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk dist/DiceLeague.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DiceLeague-apk
          path: dist/DiceLeague.apk
